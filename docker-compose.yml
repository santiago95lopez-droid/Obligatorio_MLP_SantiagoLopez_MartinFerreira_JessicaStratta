version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      # Mapea el puerto 80 público de AWS directamente al puerto 80 del contenedor (Streamlit)
      - "80:80"
      # Si querés mantener la API expuesta externamente también en AWS (opcional):
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./app_streamlit.py:/app/app_streamlit.py
    environment:
      - PYTHONUNBUFFERED=1